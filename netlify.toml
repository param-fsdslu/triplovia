# Netlify detects Next.js and applies its Next.js runtime (@netlify/plugin-nextjs) automatically.
[build]
  command = "npm run build"
  publish = ".next"

# firebase-admin 14 needs Node 22 (its auth module require()s the ESM-only jose, which Node only
# allows from 22.12; package.json also pins jose 5, which works on any version). Functions run on
# the build's Node major.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Firebase sign-in helpers must stay on triplovia.com in the browser.
# Upstream uses the Firebase project ID "triploviia" (two i's).
[[redirects]]
  from = "/__/auth/*"
  to = "https://triploviia.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true
